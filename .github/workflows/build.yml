name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Test and build JAR + Linux amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve and validate version
        id: meta
        run: python3 tools/release.py metadata
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Check documentation links
        run: python3 tools/check-docs.py
      - name: Test and package
        env:
          BUILD_VERSION: ${{ steps.meta.outputs.version }}
          MLD_SERVER_BINARY: ${{ github.workspace }}/dist/mod-list-discovery-server
        run: |
          make test VERSION="$BUILD_VERSION"
          make package VERSION="$BUILD_VERSION"
      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Java test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: client/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish tagged release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist/release/
      - name: Publish complete release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: bash tools/publish-release.sh
